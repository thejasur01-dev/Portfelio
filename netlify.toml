# Netlify: Git orqali ulansa, sayt shu sozlamalar bilan yig'iladi.
# (dist papkasini qo'lda tashlasangiz ham ishlaydi.)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Nomi xeshlangan fayllar (JS, CSS) — uzoq kesh; index.html — har doim yangi.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
